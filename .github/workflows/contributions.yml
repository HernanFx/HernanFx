name: generate contributions data

on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: generate-contributions-svg
        run: python .github/scripts/generate_contributions.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANG_TOKEN: ${{ secrets.LANG_TOKEN }}

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-branch

      - name: Copy SVG and push
        run: |
          cp dist/github-contributions.svg output-branch/github-contributions.svg
          cd output-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contributions.svg
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update github-contributions.svg"
            git pull --rebase origin output
            git push
          fi
