name: generate languages data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: generate-languages-svg
        run: python .github/scripts/generate_languages.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-branch

      - name: Copy SVG and push
        run: |
          cp dist/github-languages.svg output-branch/github-languages.svg
          cd output-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-languages.svg
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update github-languages.svg"
            git push
          fi
