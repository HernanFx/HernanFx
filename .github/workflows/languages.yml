name: generate languages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: deploy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: generate-languages-svg
        run: python .github/scripts/generate_languages.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Copy SVG to deploy
        run: |
          cp dist/github-languages.svg deploy/github-languages.svg
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-languages.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update github-languages.svg"
          git push
