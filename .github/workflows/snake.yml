name: generate animation

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: 
  push:
    branches:
      - main 

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: generate-snake-svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HernanFx
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23272996&color_dots=%23161b22,%231e6e,%233c33bb,%235048cd,%237d76da&palette=github-dark
            
      - name: push-snake-svg-to-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
