name: generate animation

on:
  schedule:
    - cron: "0 0 * * *" # Arreglado: Se ejecuta exactamente a la medianoche todos los días
  workflow_dispatch: # Permite correrlo manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Genera el SVG con tus cuadros actualizados
      - name: generate-snake-svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HernanFx
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#272996&color_dots=#161b22,#1c1e6e,#272996,#4144cc,#5f63ff
            
      # Empuja los cambios a la rama output
      - name: push-snake-svg-to-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
