name: generate animation

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate-snake-svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HernanFx
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%233c33bb&color_dots=%23161b22,%233c33bb,%234035ce,%235349df,%23736be4

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-branch

      - name: Copy SVG and push
        run: |
          cp dist/github-contribution-grid-snake.svg output-branch/github-contribution-grid-snake.svg
          cd output-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update github-contribution-grid-snake.svg"
            git push
          fi
