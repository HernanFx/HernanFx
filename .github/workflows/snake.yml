name: generate animation

on:
  schedule:
    - cron: "0 5 * * *" # Se ejecuta a las 00:00 en Perú (UTC-5)
  workflow_dispatch: 
  push:
    branches:
      - main 

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: generate-snake-svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HernanFx
          outputs: |
            dist/github-contribution-grid-snake.svg
          # Aquí obligamos a la extensión a usar tus colores exactos y borrar el verde
          color_snake: "#272996"
          color_dots: "#161b22,#1e6e,#3c33bb,#161b22,#161b22"
            
      - name: push-snake-svg-to-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
