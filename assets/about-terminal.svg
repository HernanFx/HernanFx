<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Sobre mi">
  <title>Sobre mi</title>
  <style>
    .t-line { font-family: 'Segoe UI', Consolas, monospace; font-size: 15px; fill: #C9D1D9; }
    .t-prompt { fill: #6C5CE7; }
  </style>

  <rect x="10" y="10" width="780" height="250" rx="12" fill="#0D1117" stroke="#30363D"/>
  <rect x="10" y="10" width="780" height="32" rx="12" fill="#161B22"/>
  <rect x="10" y="34" width="780" height="8" fill="#161B22"/>

  <circle cx="34" cy="26" r="6" fill="#FF5F56"/>
  <circle cx="54" cy="26" r="6" fill="#FFBD2E"/>
  <circle cx="74" cy="26" r="6" fill="#27C93F"/>
  <text x="400" y="30" text-anchor="middle" font-size="11" fill="#8B949E" font-family="'Segoe UI', Consolas, monospace">HernanFx</text>

  <text x="28" y="66" class="t-line">
    <tspan class="t-prompt">&gt; </tspan>Estudiante de Ingeniería de Sistemas apasionado por sistemas y soluciones tecnológicas
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.12;1" dur="11s" begin="0.4s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="93" class="t-line">
    <tspan class="t-prompt">&gt; </tspan>Interesado en backend, estructuras de datos y bases de datos
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.12;1" dur="11s" begin="1.9s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="120" class="t-line">
    <tspan class="t-prompt">&gt; </tspan>Siempre aprendiendo nuevas tecnologías y frameworks
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.12;1" dur="11s" begin="3.4s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="147" class="t-line">
    <tspan class="t-prompt">&gt; </tspan>Apasionado por la resolución de problemas con nuevas tecnologías
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.12;1" dur="11s" begin="4.9s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="174" class="t-line">
    <tspan class="t-prompt">&gt; </tspan>Enfocado en crear sistemas eficientes y escalables
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.12;1" dur="11s" begin="6.4s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="201" class="t-line">
    <tspan class="t-prompt">&gt; </tspan>Abierto a oportunidades de trabajo o prácticas
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.12;1" dur="11s" begin="7.9s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="228" class="t-line">
    <tspan class="t-prompt">&gt; </tspan>Actualmente: Python · C++ · Node.js · PostgreSQL
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.12;1" dur="11s" begin="9.4s" repeatCount="indefinite"/>
  </text>

  <rect x="480" y="211" width="8" height="17" rx="1.5" fill="#6C5CE7">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
