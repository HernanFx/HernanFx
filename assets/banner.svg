<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-label="Hernan Felix">
  <title>Hernan Felix</title>
  <style>
    .banner-glow { filter: drop-shadow(0 0 8px rgba(108, 92, 231, 0.5)); }
    .name-line { font-family: 'Segoe UI', Arial, sans-serif; font-size: 44px; font-weight: 700; letter-spacing: 1px; text-anchor: middle; }
    .tag-line { font-family: 'Segoe UI', Arial, sans-serif; font-size: 25px; font-weight: 400; letter-spacing: 2px; text-anchor: middle; }
  </style>

  <defs>
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.33" stop-color="#736BE4"/>
      <stop offset="0.66" stop-color="#4035CE"/>
      <stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="784" height="194" rx="16" fill="#0D1117" stroke="#30363D"/>

  <rect x="120" y="54" width="24" height="6" rx="3" fill="#6C5CE7" fill-opacity="0.35"/>
  <rect x="656" y="54" width="24" height="6" rx="3" fill="#6C5CE7" fill-opacity="0.35"/>

  <text x="400" y="70" class="name-line banner-glow" fill="url(#bannerGrad)">Hernan Felix</text>

  <text x="400" y="115" class="tag-line" fill="#C9D1D9">Software &amp; Hardware</text>

  <text x="400" y="155" class="tag-line" fill="#C9D1D9">Sistemas &amp; Soluciones Tecnológicas</text>

  <rect x="330" y="178" width="140" height="3" rx="1.5" fill="url(#bannerGrad)"/>
</svg>
