<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-label="HernanFx">
  <title>HernanFx</title>
  <style>
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(108, 92, 231, 0.45)); }
      50%      { filter: drop-shadow(0 0 10px rgba(108, 92, 231, 0.9)); }
    }
    .title-glow { animation: glowPulse 3s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.33" stop-color="#736BE4"/>
      <stop offset="0.66" stop-color="#4035CE"/>
      <stop offset="1" stop-color="#6C5CE7"/>
      <animate attributeName="x1" values="0;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="8" y="10" width="464" height="130" rx="16" fill="#0D1117" stroke="#30363D"/>

  <text x="240" y="88" text-anchor="middle" class="title-glow" font-family="'Segoe UI', system-ui, sans-serif" font-size="58" font-weight="700" fill="url(#grad)">HernanFx</text>

  <text x="240" y="122" text-anchor="middle" font-size="15" fill="#8B949E" font-family="'Segoe UI', system-ui, sans-serif" letter-spacing="5">
    SOFTWARE &amp; HARDWARE
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
  </text>
</svg>
