<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Mi Stack - TypeScript, CSS, HTML, JSX, JSON y PostgreSQL">
  <style>
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .gI { filter: drop-shadow(0 0 6px rgba(155,143,248,0.35)); }
    .gO { filter: drop-shadow(0 0 6px rgba(139,124,247,0.35)); }
    .gT { filter: drop-shadow(0 0 6px rgba(124,111,240,0.35)); }
    .gS { filter: drop-shadow(0 0 6px rgba(108,92,231,0.35)); }
    .gZ { filter: drop-shadow(0 0 6px rgba(90,75,214,0.35)); }
    .gL { filter: drop-shadow(0 0 6px rgba(74,63,191,0.35)); }
  </style>

  <defs>
    <!-- bloque base 24px: hereda el fill desde el contenedor de la pieza, lleva bisel claro -->
    <g id="blk">
      <rect width="24" height="24" rx="4" fill="inherit" stroke="#0B0F17" stroke-width="1.5"/>
      <rect x="2.5" y="2.5" width="19" height="7" rx="3.5" fill="#FFFFFF" opacity="0.12"/>
    </g>
    <!-- fantasma: contorno sutil de la posicion final de cada pieza -->
    <g id="ghost">
      <rect width="24" height="24" rx="4" fill="none" stroke="inherit" stroke-width="1.5" opacity="0.22"/>
    </g>
  </defs>

  <!-- tarjeta oscura del perfil -->
  <rect x="10" y="10" width="740" height="380" rx="16" fill="#0D1117" stroke="#30363D"/>

  <!-- tablero compacto 13x11 (celdas de 24px) -->
  <rect x="224" y="44" width="312" height="264" rx="8" fill="#131A24" stroke="#30363D" stroke-width="1.5"/>
  <!-- reticula de guia sutil -->
  <path d="M248 44V308 M272 44V308 M296 44V308 M320 44V308 M344 44V308 M368 44V308 M392 44V308 M416 44V308 M440 44V308 M464 44V308 M488 44V308 M512 44V308 M224 68H536 M224 92H536 M224 116H536 M224 140H536 M224 164H536 M224 188H536 M224 212H536 M224 236H536 M224 260H536 M224 284H536" fill="none" stroke="#30363D" stroke-width="1" opacity="0.16"/>

  <!-- fantasmas de destino (posicion final de cada pieza) -->
  <g stroke="#9B8FF8">
    <use href="#ghost" x="320" y="284"/><use href="#ghost" x="344" y="284"/><use href="#ghost" x="368" y="284"/><use href="#ghost" x="392" y="284"/>
  </g>
  <g stroke="#8B7CF7">
    <use href="#ghost" x="320" y="236"/><use href="#ghost" x="344" y="236"/><use href="#ghost" x="320" y="260"/><use href="#ghost" x="344" y="260"/>
  </g>
  <g stroke="#7C6FF0">
    <use href="#ghost" x="368" y="188"/><use href="#ghost" x="392" y="188"/><use href="#ghost" x="416" y="188"/><use href="#ghost" x="392" y="212"/>
  </g>
  <g stroke="#6C5CE7">
    <use href="#ghost" x="416" y="260"/><use href="#ghost" x="440" y="260"/><use href="#ghost" x="440" y="284"/><use href="#ghost" x="464" y="284"/>
  </g>
  <g stroke="#5A4BD6">
    <use href="#ghost" x="464" y="188"/><use href="#ghost" x="488" y="188"/><use href="#ghost" x="488" y="212"/><use href="#ghost" x="512" y="212"/>
  </g>
  <g stroke="#4A3FBF">
    <use href="#ghost" x="248" y="236"/><use href="#ghost" x="248" y="260"/><use href="#ghost" x="248" y="284"/><use href="#ghost" x="272" y="284"/>
  </g>

  <!-- PIEZA I - TypeScript: cae 0.36-1.44s, fila inferior horizontal -->
  <g class="gI" fill="#9B8FF8">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -360; 0 -360; 0 -270; 0 -180; 0 -100; 0 -45; 0 -10; 0 0; 0 0; 0 0" keyTimes="0;0.03;0.057;0.075;0.0885;0.1002;0.111;0.12;0.88;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.045;0.88;0.92;1" dur="12s" repeatCount="indefinite"/>
    <use href="#blk" x="320" y="284"/><use href="#blk" x="344" y="284"/><use href="#blk" x="368" y="284"/><use href="#blk" x="392" y="284"/>
  </g>

  <!-- PIEZA O - CSS: cae 1.68-2.76s, cuadrado 2x2 sobre la I -->
  <g class="gO" fill="#8B7CF7">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -360; 0 -360; 0 -270; 0 -180; 0 -100; 0 -45; 0 -10; 0 0; 0 0; 0 0" keyTimes="0;0.14;0.167;0.185;0.1985;0.2102;0.221;0.23;0.88;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.155;0.88;0.92;1" dur="12s" repeatCount="indefinite"/>
    <use href="#blk" x="320" y="236"/><use href="#blk" x="344" y="236"/><use href="#blk" x="320" y="260"/><use href="#blk" x="344" y="260"/>
  </g>

  <!-- PIEZA T - HTML: cae 3.00-4.08s, T en zona media -->
  <g class="gT" fill="#7C6FF0">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -360; 0 -360; 0 -270; 0 -180; 0 -100; 0 -45; 0 -10; 0 0; 0 0; 0 0" keyTimes="0;0.25;0.277;0.295;0.3085;0.3202;0.331;0.34;0.88;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.265;0.88;0.92;1" dur="12s" repeatCount="indefinite"/>
    <use href="#blk" x="368" y="188"/><use href="#blk" x="392" y="188"/><use href="#blk" x="416" y="188"/><use href="#blk" x="392" y="212"/>
  </g>

  <!-- PIEZA S - JSX: cae 4.32-5.40s, zigzag en esquina inferior derecha -->
  <g class="gS" fill="#6C5CE7">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -360; 0 -360; 0 -270; 0 -180; 0 -100; 0 -45; 0 -10; 0 0; 0 0; 0 0" keyTimes="0;0.36;0.387;0.405;0.4185;0.4302;0.441;0.45;0.88;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.375;0.88;0.92;1" dur="12s" repeatCount="indefinite"/>
    <use href="#blk" x="416" y="260"/><use href="#blk" x="440" y="260"/><use href="#blk" x="440" y="284"/><use href="#blk" x="464" y="284"/>
  </g>

  <!-- PIEZA Z - JSON: cae 5.64-6.72s, zigzag contra la pared derecha -->
  <g class="gZ" fill="#5A4BD6">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -360; 0 -360; 0 -270; 0 -180; 0 -100; 0 -45; 0 -10; 0 0; 0 0; 0 0" keyTimes="0;0.47;0.497;0.515;0.5285;0.5402;0.551;0.56;0.88;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.485;0.88;0.92;1" dur="12s" repeatCount="indefinite"/>
    <use href="#blk" x="464" y="188"/><use href="#blk" x="488" y="188"/><use href="#blk" x="488" y="212"/><use href="#blk" x="512" y="212"/>
  </g>

  <!-- PIEZA L - PostgreSQL: cae 6.96-8.04s, L contra la pared izquierda -->
  <g class="gL" fill="#4A3FBF">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -360; 0 -360; 0 -270; 0 -180; 0 -100; 0 -45; 0 -10; 0 0; 0 0; 0 0" keyTimes="0;0.58;0.607;0.625;0.6385;0.6502;0.661;0.67;0.88;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.595;0.88;0.92;1" dur="12s" repeatCount="indefinite"/>
    <use href="#blk" x="248" y="236"/><use href="#blk" x="248" y="260"/><use href="#blk" x="248" y="284"/><use href="#blk" x="272" y="284"/>
  </g>

  <!-- line clear: destello sobre la fila inferior tras asentarse todas (9.0-9.9s) -->
  <rect x="230" y="284" width="300" height="24" rx="4" fill="#FFFFFF">
    <animate attributeName="opacity" values="0;0;0.55;0;0.55;0;0.55;0;0" keyTimes="0;0.75;0.763;0.776;0.789;0.802;0.815;0.828;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- etiquetas por tecnologia (tonos morado claro legibles sobre la tarjeta) -->
  <text x="85" y="338" class="label" fill="#C4BDFB">TypeScript</text>
  <text x="203" y="338" class="label" fill="#BDB1FA">CSS</text>
  <text x="321" y="338" class="label" fill="#B5A9F8">HTML</text>
  <text x="439" y="338" class="label" fill="#A79CF5">JSX</text>
  <text x="557" y="338" class="label" fill="#9C90F1">JSON</text>
  <text x="675" y="338" class="label" fill="#8D81EC">PostgreSQL</text>
</svg>
