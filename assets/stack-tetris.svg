<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="700" height="360" viewBox="0 0 700 360" role="img" aria-label="Mi Stack en tetris: TS, CSS, HTML, JSX, JSON y PostgreSQL">
  <style>
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
  </style>

  <defs>
    <g id="blk">
      <rect width="24" height="24" rx="4" fill="inherit" stroke="#0B0F17" stroke-width="1.5"/>
      <rect x="3" y="3" width="18" height="7" rx="3" fill="#FFFFFF" opacity="0.12"/>
    </g>
    <g id="ghost">
      <rect width="24" height="24" rx="4" fill="none" stroke="inherit" stroke-width="1.5" opacity="0.25"/>
    </g>
  </defs>

  <!-- card del perfil -->
  <rect x="10" y="10" width="680" height="340" rx="16" fill="#0D1117" stroke="#30363D"/>

  <!-- tablero 10x6, celda 24px: x=230 y=56 -->
  <rect x="230" y="56" width="240" height="144" rx="6" fill="#131A24" stroke="#30363D"/>
  <g stroke="#232B36" stroke-width="1">
    <line x1="230" y1="80" x2="470" y2="80"/><line x1="230" y1="104" x2="470" y2="104"/>
    <line x1="230" y1="128" x2="470" y2="128"/><line x1="230" y1="152" x2="470" y2="152"/>
    <line x1="230" y1="176" x2="470" y2="176"/>
    <line x1="254" y1="56" x2="254" y2="200"/><line x1="278" y1="56" x2="278" y2="200"/>
    <line x1="302" y1="56" x2="302" y2="200"/><line x1="326" y1="56" x2="326" y2="200"/>
    <line x1="350" y1="56" x2="350" y2="200"/><line x1="374" y1="56" x2="374" y2="200"/>
    <line x1="398" y1="56" x2="398" y2="200"/><line x1="422" y1="56" x2="422" y2="200"/>
    <line x1="446" y1="56" x2="446" y2="200"/>
  </g>

  <!-- ghosts de destino -->
  <g stroke="#9B8FF8"><use href="#ghost" x="230" y="176"/><use href="#ghost" x="254" y="176"/><use href="#ghost" x="278" y="176"/><use href="#ghost" x="302" y="176"/></g>
  <g stroke="#8B7CF7"><use href="#ghost" x="326" y="176"/><use href="#ghost" x="350" y="176"/><use href="#ghost" x="374" y="176"/><use href="#ghost" x="398" y="176"/></g>
  <g stroke="#7C6FF0"><use href="#ghost" x="422" y="176"/><use href="#ghost" x="446" y="176"/><use href="#ghost" x="422" y="152"/><use href="#ghost" x="446" y="152"/></g>
  <g stroke="#6C5CE7"><use href="#ghost" x="230" y="152"/><use href="#ghost" x="254" y="152"/><use href="#ghost" x="278" y="152"/><use href="#ghost" x="302" y="152"/></g>
  <g stroke="#5A4BD6"><use href="#ghost" x="326" y="152"/><use href="#ghost" x="350" y="152"/><use href="#ghost" x="374" y="152"/><use href="#ghost" x="398" y="152"/></g>
  <g stroke="#4A3FBF"><use href="#ghost" x="422" y="152"/><use href="#ghost" x="446" y="152"/><use href="#ghost" x="422" y="128"/><use href="#ghost" x="446" y="128"/></g>

  <!-- P1 TS I horizontal (fila 5: 0-3) -->
  <g fill="#9B8FF8">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.02;0.06;0.10;0.14;0.18;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.73;0.75;1" dur="14s" repeatCount="indefinite"/>
    <use href="#blk" x="230" y="176"/><use href="#blk" x="254" y="176"/><use href="#blk" x="278" y="176"/><use href="#blk" x="302" y="176"/>
  </g>

  <!-- P2 CSS I horizontal (fila 5: 4-7) -->
  <g fill="#8B7CF7">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.10;0.14;0.18;0.22;0.26;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.73;0.75;1" dur="14s" repeatCount="indefinite"/>
    <use href="#blk" x="326" y="176"/><use href="#blk" x="350" y="176"/><use href="#blk" x="374" y="176"/><use href="#blk" x="398" y="176"/>
  </g>

  <!-- P3 HTML O (fila 5: 8-9 + fila 4: 8-9) -->
  <g fill="#7C6FF0">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.18;0.22;0.26;0.30;0.34;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.73;0.75;1" dur="14s" repeatCount="indefinite"/>
    <use href="#blk" x="422" y="176"/><use href="#blk" x="446" y="176"/><use href="#blk" x="422" y="152"/><use href="#blk" x="446" y="152"/>
  </g>

  <!-- P4 JSX I horizontal (fila 4: 0-3) -->
  <g fill="#6C5CE7">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.26;0.30;0.34;0.38;0.42;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.73;0.75;1" dur="14s" repeatCount="indefinite"/>
    <use href="#blk" x="230" y="152"/><use href="#blk" x="254" y="152"/><use href="#blk" x="278" y="152"/><use href="#blk" x="302" y="152"/>
  </g>

  <!-- P5 JSON I horizontal (fila 4: 4-7) -->
  <g fill="#5A4BD6">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.34;0.38;0.42;0.46;0.50;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.73;0.75;1" dur="14s" repeatCount="indefinite"/>
    <use href="#blk" x="326" y="152"/><use href="#blk" x="350" y="152"/><use href="#blk" x="374" y="152"/><use href="#blk" x="398" y="152"/>
  </g>

  <!-- P6 PostgreSQL O (fila 4: 8-9 + fila 3: 8-9) -->
  <g fill="#4A3FBF">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.42;0.46;0.50;0.54;0.58;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.73;0.75;1" dur="14s" repeatCount="indefinite"/>
    <use href="#blk" x="422" y="152"/><use href="#blk" x="446" y="152"/><use href="#blk" x="422" y="128"/><use href="#blk" x="446" y="128"/>
  </g>

  <!-- destello line clear fila 5 (completa) -->
  <rect x="230" y="176" width="240" height="24" fill="#FFFFFF" opacity="0.55">
    <animate attributeName="opacity" values="0;0;0.55;0;0.55;0;0.55;0;0" keyTimes="0;0.63;0.635;0.65;0.655;0.67;0.675;0.69;1" dur="14s" repeatCount="indefinite"/>
  </rect>

  <!-- destello line clear fila 4 (completa) -->
  <rect x="230" y="152" width="240" height="24" fill="#FFFFFF" opacity="0.55">
    <animate attributeName="opacity" values="0;0;0.55;0;0.55;0;0.55;0;0" keyTimes="0;0.635;0.64;0.655;0.66;0.675;0.68;0.695;1" dur="14s" repeatCount="indefinite"/>
  </rect>

  <!-- etiquetas DENTRO del cuadro -->
  <text x="130" y="322" class="label" fill="#9B8FF8">TS</text>
  <text x="218" y="322" class="label" fill="#8B7CF7">CSS</text>
  <text x="306" y="322" class="label" fill="#7C6FF0">HTML</text>
  <text x="394" y="322" class="label" fill="#6C5CE7">JSX</text>
  <text x="482" y="322" class="label" fill="#5A4BD6">JSON</text>
  <text x="570" y="322" class="label" fill="#4A3FBF">PostgreSQL</text>
</svg>
