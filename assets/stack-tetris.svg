<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Mi Stack en tetris: TS, CSS, HTML, JSX, JSON, PostgreSQL, React, Node y Git">
  <style>
    .label { 
      font-family: Arial, sans-serif; 
      font-size: 14px; 
      font-weight: normal; 
      letter-spacing: 0.5px; 
      text-anchor: middle; 
    }
  </style>

  <defs>
    <!-- Bloque estilo Github Contributions -->
    <g id="blk">
      <rect x="2" y="2" width="18" height="18" rx="2" fill="inherit" />
    </g>
    <!-- Patrón para el fondo de celdas vacías -->
    <pattern id="bg-grid" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="translate(170, 40)">
      <rect x="2" y="2" width="18" height="18" rx="2" fill="#161B22" />
    </pattern>
  </defs>

  <!-- Tablero 10x6 estilo snake -->
  <rect x="170" y="40" width="220" height="132" fill="url(#bg-grid)" />

  <!-- P1 TS pieza I horizontal -->
  <g fill="#9B8FF8">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.02;0.06;0.10;0.14;0.18;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="170" y="150"/><use xlink:href="#blk" x="192" y="150"/><use xlink:href="#blk" x="214" y="150"/><use xlink:href="#blk" x="236" y="150"/>
  </g>

  <!-- P2 CSS pieza S -->
  <g fill="#8B7CF7">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.10;0.14;0.18;0.22;0.26;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="258" y="150"/><use xlink:href="#blk" x="280" y="150"/><use xlink:href="#blk" x="236" y="128"/><use xlink:href="#blk" x="258" y="128"/>
  </g>

  <!-- P3 HTML pieza L (completada a 4 bloques) -->
  <g fill="#7C6FF0">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.18;0.22;0.26;0.30;0.34;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="302" y="150"/><use xlink:href="#blk" x="324" y="150"/><use xlink:href="#blk" x="324" y="128"/><use xlink:href="#blk" x="324" y="106"/>
  </g>

  <!-- P4 JSX pieza O -->
  <g fill="#6C5CE7">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.26;0.30;0.34;0.38;0.42;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="346" y="150"/><use xlink:href="#blk" x="368" y="150"/><use xlink:href="#blk" x="346" y="128"/><use xlink:href="#blk" x="368" y="128"/>
  </g>

  <!-- P5 JSON pieza T -->
  <g fill="#5A4BD6">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.34;0.38;0.42;0.46;0.50;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="170" y="128"/><use xlink:href="#blk" x="192" y="128"/><use xlink:href="#blk" x="214" y="128"/><use xlink:href="#blk" x="192" y="106"/>
  </g>

  <!-- P6 PostgreSQL pieza Z -->
  <g fill="#4A3FBF">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.42;0.46;0.50;0.54;0.58;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="280" y="128"/><use xlink:href="#blk" x="302" y="128"/><use xlink:href="#blk" x="258" y="106"/><use xlink:href="#blk" x="280" y="106"/>
  </g>

  <!-- P7 React pieza O -->
  <g fill="#8B7CF7">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.50;0.54;0.58;0.62;0.66;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="214" y="106"/><use xlink:href="#blk" x="236" y="106"/><use xlink:href="#blk" x="214" y="84"/><use xlink:href="#blk" x="236" y="84"/>
  </g>

  <!-- P8 Node pieza I vertical -->
  <g fill="#6C5CE7">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.58;0.62;0.66;0.70;0.74;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="170" y="106"/><use xlink:href="#blk" x="170" y="84"/><use xlink:href="#blk" x="170" y="62"/><use xlink:href="#blk" x="170" y="40"/>
  </g>

  <!-- P9 Git pieza J -->
  <g fill="#9B8FF8">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="0 -320;0 -240;0 -160;0 -80;0 -30;0 0;0 0" keyTimes="0;0.66;0.70;0.74;0.78;0.82;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.90;0.92;1" dur="14s" repeatCount="indefinite"/>
    <use xlink:href="#blk" x="368" y="106"/><use xlink:href="#blk" x="368" y="84"/><use xlink:href="#blk" x="368" y="62"/><use xlink:href="#blk" x="346" y="106"/>
  </g>

  <!-- destello line clear fila 5 -->
  <rect x="170" y="150" width="220" height="22" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0;0.55;0;0.55;0;0.55;0;0" keyTimes="0;0.84;0.845;0.86;0.865;0.88;0.885;0.90;1" dur="14s" repeatCount="indefinite"/>
  </rect>

  <!-- destello line clear fila 4 -->
  <rect x="170" y="128" width="220" height="22" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0;0.55;0;0.55;0;0.55;0;0" keyTimes="0;0.845;0.85;0.865;0.87;0.885;0.89;0.905;1" dur="14s" repeatCount="indefinite"/>
  </rect>

  <!-- Etiquetas que aparecen secuencialmente -->
  <!-- Fila 1 -->
  <text x="130" y="225" class="label" fill="#9B8FF8" opacity="0">TS<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.19;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="205" y="225" class="label" fill="#8B7CF7" opacity="0">CSS<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.27;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="280" y="225" class="label" fill="#7C6FF0" opacity="0">HTML<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.35;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="355" y="225" class="label" fill="#6C5CE7" opacity="0">JSX<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.43;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="430" y="225" class="label" fill="#5A4BD6" opacity="0">JSON<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.51;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>

  <!-- Fila 2 -->
  <text x="160" y="260" class="label" fill="#4A3FBF" opacity="0">PostgreSQL<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.59;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="240" y="260" class="label" fill="#8B7CF7" opacity="0">React<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.67;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="320" y="260" class="label" fill="#6C5CE7" opacity="0">Node<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>
  <text x="400" y="260" class="label" fill="#9B8FF8" opacity="0">Git<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.83;0.90;0.92;1" dur="14s" repeatCount="indefinite"/></text>
</svg>
