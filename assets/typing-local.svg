<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" role="img" aria-label="Hernan Felix — escribiendo">
  <title>Hernan Felix</title>
  <style>
    .type-line { font-family: 'Segoe UI', monospace; font-size: 31px; fill: #C9D1D9; }
  </style>

  <defs>
    <clipPath id="clip1"><rect x="40" y="10" width="210" height="110">
      <animate attributeName="width" values="0;0;210;210" keyTimes="0;0.035;0.162;1" dur="8.5s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip2"><rect x="40" y="10" width="330" height="110">
      <animate attributeName="width" values="0;0;330;330" keyTimes="0;0.212;0.413;1" dur="8.5s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip3"><rect x="40" y="10" width="600" height="110">
      <animate attributeName="width" values="0;0;600;600" keyTimes="0;0.459;0.829;1" dur="8.5s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect x="8" y="8" width="784" height="114" rx="16" fill="#0D1117" stroke="#30363D"/>

  <text x="40" y="50" class="type-line" clip-path="url(#clip1)">Hernan Felix</text>
  <text x="40" y="80" class="type-line" clip-path="url(#clip2)">Software &amp; Hardware</text>
  <text x="40" y="110" class="type-line" clip-path="url(#clip3)">Sistemas &amp; Soluciones Tecnológicas</text>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.162;0.163;0.212;0.213;1" dur="8.5s" repeatCount="indefinite"/>
    <rect x="252" y="24" width="3" height="28" rx="1.5" fill="#6C5CE7">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.413;0.414;0.459;0.460;1" dur="8.5s" repeatCount="indefinite"/>
    <rect x="372" y="54" width="3" height="28" rx="1.5" fill="#6C5CE7">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.829;0.830;0.929;0.930;1" dur="8.5s" repeatCount="indefinite"/>
    <rect x="642" y="84" width="3" height="28" rx="1.5" fill="#6C5CE7">
